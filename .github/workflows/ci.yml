name: CPU contract and package gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=68" wheel
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - name: Regular wheel and sdist consumers with offline hash-lock replay
        run: python tools/verify_sidscope_distribution_install.py --output-dir /tmp/sidscope-install-matrix
      - run: python tools/verify_sidscope_contract_registry.py
      - run: python tools/verify_sidscope_sprint2_contracts.py
      - run: python tools/verify_sidscope_1_2_closure.py
      - run: python tools/verify_sidscope_1_2_legacy_migration_matrix.py
      - run: python tools/verify_sidscope_1_2_cli_baseline.py
      - run: python tools/verify_sidscope_1_3_plugin_ecosystem.py
      - run: python tools/verify_sidscope_1_4_evidence_system.py
      - run: python tools/verify_sidscope_1_4_cli_baseline.py
      - run: python tools/verify_sidscope_1_5_conformance_ecosystem.py
      - run: python tools/verify_sidscope_1_6_hardening.py
      - run: python tools/verify_sidscope_1_7_stabilization.py
      - run: python tools/verify_sidscope_sdlc_hardening.py --require-engineering-ready
      - run: python tools/verify_sidscope_sdlc_acceptance.py
      - run: python tools/verify_sidscope_release_profiles.py
      - run: python tools/verify_sidscope_architecture_inventory.py
      - run: python tools/verify_sidscope_2_0_candidate.py --require-engineering-ready
      - run: python tools/verify_sidscope_release_metadata.py

  compatibility-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gate: [schemas, profiles, plugins, compatibility, migration, adoption, comparison, api, backward-compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=68" wheel
      - run: python -m pip install -e . pytest
      - name: Run contract-surface gate
        run: |
          case "${{ matrix.gate }}" in
            schemas)
              python tools/verify_sidscope_contract_registry.py
              ;;
            profiles)
              python tools/verify_sidscope_1_5_conformance_ecosystem.py --gate profiles
              ;;
            plugins)
              python tools/verify_sidscope_1_3_plugin_ecosystem.py
              ;;
            compatibility|migration|adoption|comparison|api)
              python tools/verify_sidscope_1_6_hardening.py --gate "${{ matrix.gate }}"
              ;;
            backward-compatibility)
              python tools/verify_sidscope_1_2_legacy_migration_matrix.py
              python tools/verify_sidscope_1_4_evidence_system.py
              python tools/verify_sidscope_1_6_hardening.py --gate migration
              ;;
          esac

  archive-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=68" wheel
      - run: python -m pip install -e .
      - run: python tools/build_sidscope_release_candidate_archive.py --output /tmp/sidscope-ci.zip
      - run: python tools/smoke_sidscope_release_candidate_archive.py /tmp/sidscope-ci.zip

  resource-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=68" wheel
      - run: python -m pip install -e .
      - run: python tools/verify_sidscope_resource_package.py
