[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidinspector"
version = "2.0.0"
description = "Artifact-level diagnostics for semantic-ID generative recommendation"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Jiandong Ding"},
  {name = "Huijie Qin"},
  {name = "Tiandeng Wu"},
  {name = "Yi Cao"},
]
keywords = [
  "semantic-id",
  "generative recommendation",
  "recommender systems",
  "diagnostics",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
latte = [
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3.0,<6",
]

[project.urls]
Homepage = "https://github.com/jdding/sidscope"
Repository = "https://github.com/jdding/sidscope"

[project.scripts]
sidscope = "sidinspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidinspector = ["schemas/*.json"]
